server:
  port: 8082

spring:
  application:
    name: user-authentication-service
  datasource:
    url: jdbc:mysql://localhost:3306/kawach_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8076/eureka
    register-with-eureka: true
    fetch-registry: true

jwt:
  secret: kawachSecretKey
  expiration: 3600

rabbitmq:
  exchange: kawach.exchange
  queue:
    doctor: doctor.queue
    volunteer: volunteer.queue
  routing:
    key:
      doctor: doctor.routing.key
      volunteer: volunteer.routing.key
