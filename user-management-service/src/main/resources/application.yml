server:
  port: 8081
spring:
  application:
    name: user-management-service
  data:
    mongodb:
      host: localhost
      port: 27017
      database: kawach_user_management
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8076/eureka
    register-with-eureka: true
    fetch-registry: true
rabbitmq:
  exchange: kawach.exchange
  queue:
    doctor: doctor.queue
    volunteer: volunteer.queue
  routing:
    key:
      doctor: doctor.routing.key
      volunteer: volunteer.routing.key
