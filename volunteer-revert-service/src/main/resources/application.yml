server:
  port: 8085

spring:
  application:
    name: volunteer-revert-service
  data:
    mongodb:
      host: localhost
      port: 27017
      database: kawach_volunteer_revert
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8076/eureka
    register-with-eureka: true
    fetch-registry: true

rabbitmq:
  exchange: kawach.exchange
  queue:
    volunteer: volunteer.queue
  routing:
    key:
      volunteer: volunteer.routing.key
