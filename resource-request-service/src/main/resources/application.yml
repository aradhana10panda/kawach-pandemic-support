server:
  port: 8087

spring:
  application:
    name: resource-request-service
  data:
    mongodb:
      host: localhost
      port: 27017
      database: kawach_resources
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8076/eureka
    register-with-eureka: true
    fetch-registry: true
